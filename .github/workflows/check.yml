name: Check and package extension

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Check JavaScript syntax
        run: |
          node --check src/main.js
          node --check extension/popup.js
          node --check extension/content.js
      - name: Check manifest
        run: python3 -m json.tool extension/manifest.json >/dev/null
      - name: Check extension policy invariants
        run: python3 scripts/check-extension-policy.py
      - name: Package extension
        run: ./package-extension.sh
      - name: Upload extension package
        uses: actions/upload-artifact@v4
        with:
          name: applicant-desk-autofill
          path: dist/*.zip
